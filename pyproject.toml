[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "WAP-Tool"
dynamic = ["version"]
description = "Use WSPR data to analyze your antenna's performance"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Fred C.", email = "github-fred@hidzz.com" }
]
keywords = ["ham radio", "wspr", "antenna"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "adif-parser",
    "folium",
    "matplotlib",
    "scipy",
    "numpy",
    "pandas",
]

[project.urls]
Homepage = "https://github.com/0x9900/wap"
Repository = "https://github.com/0x9900/wap"

[project.scripts]
wap = "wap.wap:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wap"]

[tool.hatch.version]
path = "src/wap/wap.py"

[project.optional-dependencies]
dev = [
    "build",
    "flake8",
    "geo_ham",
    "isort",
    "mypy",
    "pre-commit",
    "pylint",
    "twine",
]

[tool.mypy]
ignore_missing_imports = true
